<!doctype html>
<html lang="">
  <head> </head>
  <body>
    <div id="before-app-mounted">
      <noscript>这个网站需要javascript才可以运行，请启用javascript.</noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #000;
          color: #fff;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          gap: 1.5rem;
        "
      >
        <div class="brand" style="text-align: center">
          <h1
            class="brand-cn"
            style="
              font-size: 1.75rem;
              font-weight: 600;
              margin: 0 0 0.25rem 0;
              letter-spacing: 0.15em;
            "
          >
            网络技术部
          </h1>
          <p
            class="brand-en"
            style="
              font-size: 0.85rem;
              margin: 0;
              letter-spacing: 0.3em;
              color: rgba(255, 255, 255, 0.55);
              text-transform: uppercase;
            "
          >
            Network Department
          </p>
        </div>

        <div
          class="progress"
          style="
            width: 14rem;
            max-width: 60vw;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
          "
        >
          <div
            class="progress-fg"
            style="
              position: absolute;
              inset: 0;
              background: #fff;
              transform-origin: left center;
              transform: scaleX(0);
              transition: transform 0.35s ease;
              will-change: transform;
            "
          ></div>
        </div>

        <p
          class="loading-title"
          style="
            font-size: 0.75rem;
            margin: 0;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
          "
        >
          Loading
        </p>

        <div class="loading-error" style="display: none">
          <div class="error-title">Error</div>
          <div class="error-message"></div>
          <button class="error-button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <style>
      #before-app-mounted {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 9999;
      }

      #before-app-mounted > div {
        animation: fadeIn 800ms ease both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </body>
</html>
