<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海口市第四中学网络部官方网站</title>
    <meta
      name="description"
      content="页面介绍了海口市第四中学团委学生会网络管理部，并列举了工作内容和要求"
    />
    <meta name="keywords" content="海口市第四中学网络部" />
    <style>
      #before-app-mounted {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 9999;
        opacity: 0;
        animation: fadeIn 400ms ease forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      #before-app-mounted.fade-out {
        animation: fadeOut 600ms ease forwards;
        pointer-events: none;
      }

      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      .loading-line {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .loading-line::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: #fdd835;
        transform-origin: left center;
        animation: lineMove 1.2s ease-in-out infinite;
      }

      @keyframes lineMove {
        0% { transform: scaleX(0); transform-origin: left center; }
        49% { transform: scaleX(1); transform-origin: left center; }
        50% { transform: scaleX(1); transform-origin: right center; }
        100% { transform: scaleX(0); transform-origin: right center; }
      }
    </style>
    <link rel="preload" as="image" href="/images/slide/670613950c57a.jpg" />
    <link rel="preload" as="image" href="/images/slide/670613968e908.jpg" />
  </head>

  <body>
    <!-- 页面加载完前文字和动画 -->
    <div id="before-app-mounted">
      <noscript>这个网站需要javascript才可以运行，请启用javascript.</noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #000;
          color: #fff;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          gap: 1.5rem;
        "
      >
        <div class="brand" style="text-align: center">
          <h1
            class="brand-cn"
            style="
              font-size: 1.75rem;
              font-weight: 700;
              margin: 0;
              letter-spacing: 0.25em;
            "
          >
            网络部
          </h1>
          <p
            class="brand-en"
            style="
              font-size: 0.85rem;
              margin: 0.5rem 0 0 0;
              letter-spacing: 0.35em;
              color: rgba(255, 255, 255, 0.6);
              text-transform: uppercase;
            "
          >
            Network Department
          </p>
        </div>

        <div class="loading-line"></div>

        <p
          class="loading-title"
          style="
            font-size: 0.7rem;
            margin: 0;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
          "
        >
          Loading
        </p>

        <div class="loading-error" style="display: none">
          <div class="error-title">Error</div>
          <div class="error-message"></div>
          <button class="error-button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>

    <div style="display: none;" id="app"></div>

    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
